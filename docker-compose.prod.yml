# Production / Coolify: Postgres + API + nginx (SPA + /api proxy).
# Step-by-step: docs/COOLIFY.md
# Set in Coolify / env: POSTGRES_PASSWORD, SESSION_SECRET, WEB_ORIGIN (public https URL).
#
# Point your Coolify domain at the "web" service port 80. The browser uses same-origin
# /api so cookies and CORS stay simple.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-projecterp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-projecterp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-projecterp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-projecterp}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-projecterp}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
