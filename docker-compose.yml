# Local dev: Postgres only (port 15432 on loopback). Run API + web with `pnpm dev` on the host.
# Production / Coolify: use docker-compose.prod.yml (Postgres + API + nginx web with /api proxy).
services:
  postgres:
    image: postgres:16-alpine
    container_name: projecterp-postgres
    environment:
      POSTGRES_USER: projecterp
      POSTGRES_PASSWORD: projecterp
      POSTGRES_DB: projecterp
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - projecterp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecterp -d projecterp"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  projecterp_pgdata:
